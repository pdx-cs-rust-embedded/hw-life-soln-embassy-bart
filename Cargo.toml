[package]
name = "life2"
authors = ["Bart Massey <bart.massey@gmail.com>"]
edition = "2021"
version = "0.1.0"

[dependencies]
cortex-m-rt = "0.7.5"
panic-probe = "1.0.0"
embassy-futures = "0.1.2"
display-interface = "0.5.0"
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
mipidsi = "0.8.0"
embassy-time = "0.5"

[dependencies.defmt-rtt]
version = "1.1.0"
optional = true

[dependencies.defmt]
version = "0.3"
optional = true

[dependencies.microbit-bsp]
default-features = false
path = "/usr/local/src/old/microbit-bsp"

[dependencies.nanorand]
version = "0.8.0"
default-features = false
features = ["pcg64"]

[dependencies.embassy-executor]
version = "0.9.1"
features = ["arch-cortex-m", "executor-thread"]

[dependencies.cortex-m]
version = "0.7.7"
features = ["critical-section-single-core"]


[profile.release]
debug = 2

[features]
defmt = [
      "dep:defmt-rtt",
      "dep:defmt",
      "embassy-futures/defmt",
      "embassy-executor/defmt",
      "panic-probe/print-defmt",
      "microbit-bsp/defmt",
]
frame-timing = ["defmt"]
